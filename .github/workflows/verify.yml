name: Verify experimental UCLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test and build on the actual host
        run: python tools/dev.py all --evidence .build/ci
      - name: Drive packaged commands and recovery
        run: python tools/check_app.py --evidence .build/ci/acceptance
      - name: Check local installer preservation
        run: python tools/check_install.py --build-receipt .build/ci/receipt.json --acceptance-receipt .build/ci/acceptance/receipt.json --evidence .build/ci/installer
